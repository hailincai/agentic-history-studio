[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-history-studio"
version = "0.1.0"
description = "Deterministic infrastructure for source-grounded historical documentaries"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.10,<3", "openai>=2.54,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
